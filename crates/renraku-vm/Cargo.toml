[package]
name = "renraku-vm"
default-run = "renraku-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
uuid = { version = "1.29", features = ["v4"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
sha2 = "0.11.1"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "renraku-checkpoint-probe"
path = "tests/support/checkpoint_probe.rs"
test = false

[[bin]]
name = "renraku-effect-probe"
path = "tests/support/effect_probe.rs"
test = false
