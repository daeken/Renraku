[package]
name = "renraku-openai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.4"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls"] }
renraku-vm = { path = "../renraku-vm" }
rusqlite = { version = "0.41.1", features = ["bundled"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1.54", features = ["rt", "macros", "time", "sync", "net"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
rand = "0.8"
rsa = "0.9.10"
